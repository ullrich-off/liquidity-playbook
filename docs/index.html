<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>Liquidity Playbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: fixed ink sidebar + wide reading column; every concept gets a full-width chart */
:root{
  color-scheme:dark;
  --bg:#000000; --panel:#0D0D0D; --panel2:#1A1A1A; --ink:#FFFFFF; --ink2:#D4D4D4; --mute:#8C8C8C; --line:#2E2E2E;
  --side:#000000; --side-ink:#FFFFFF; --side-mute:#8C8C8C; --side-line:#2E2E2E;
  --liq:#FF9800; --liq-ink:#FFB74D; --blue:#5B8DFF; --good:#26A69A; --bad:#F7525F;
  --cup:#FFFFFF; --cdn:#7A7A7A;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}

#side{position:fixed;inset:0 auto 0 0;width:310px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;z-index:30;border-right:1px solid var(--side-line)}
.brand{padding:26px 24px 18px;border-bottom:1px solid var(--side-line)}
.brand b{font:800 25px/1 var(--f-display);letter-spacing:-.02em;display:block}
.brand b i{font-style:normal;color:var(--mute)}
.brand span{display:block;margin-top:8px;font:400 12px/1.4 var(--f-mono);color:var(--side-mute);letter-spacing:.02em}
.prog{padding:16px 24px;border-bottom:1px solid var(--side-line);display:flex;gap:14px;align-items:center}
.prog svg{flex:none}
.prog div{font:400 12px/1.45 var(--f-mono);color:var(--side-mute)}
.prog strong{display:block;font:600 15px/1.2 var(--f-body);color:var(--side-ink)}
#nav{flex:1;overflow-y:auto;padding:10px 12px 20px;scrollbar-width:thin;scrollbar-color:var(--side-line) transparent}
.nav-part{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--side-mute);padding:20px 12px 8px}
.nav-i{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;color:var(--side-ink);font:500 14.5px/1.3 var(--f-body)}
.nav-i:hover{background:var(--side-line)}
.nav-i[aria-current=page]{background:#fff;color:#000}
.nav-i .no{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--side-mute);display:grid;place-items:center;font:500 11px/1 var(--f-mono);color:var(--side-mute)}
.nav-i[aria-current=page] .no{border-color:#000;color:#000}
.nav-i.done .no{background:#fff;border-color:#fff;color:#000}
.side-foot{padding:14px 24px;border-top:1px solid var(--side-line);display:flex;justify-content:space-between;align-items:center;font:400 12px var(--f-mono);color:var(--side-mute)}
.side-foot button{background:none;border:1px solid var(--side-line);color:var(--side-ink);border-radius:20px;padding:5px 12px;font:500 12px var(--f-mono)}
#burger{display:none}

#main{margin-left:310px;min-height:100vh}
.page{max-width:none;margin:0;padding-block:56px 90px;padding-left:max(clamp(24px,3.2vw,72px),env(safe-area-inset-left,0px));padding-right:max(clamp(24px,3.2vw,72px),env(safe-area-inset-right,0px))}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font:800 clamp(34px,4.4vw,56px)/1.04 var(--f-display);letter-spacing:-.025em;margin:14px 0 18px;text-wrap:balance}
h2{font:700 29px/1.15 var(--f-display);letter-spacing:-.015em;margin:60px 0 14px;text-wrap:balance}
h3{font:700 19px/1.3 var(--f-display);margin:34px 0 8px}
p{margin:0 0 16px;max-width:110ch}
.lead{font-size:20px;line-height:1.6;color:var(--ink2);max-width:66ch}
ul,ol{max-width:110ch;padding-left:22px;margin:0 0 18px}
li{margin:6px 0}
strong{font-weight:600}
code,.mono{font-family:var(--f-mono);font-size:.88em;background:var(--panel2);padding:1px 6px;border-radius:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.chip{font:500 12px/1 var(--f-mono);padding:7px 11px;border:1px solid var(--line);border-radius:20px;color:var(--ink2);background:var(--panel)}
.goals{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin:6px 0 10px}
.goals h4{margin:0 0 8px;font:500 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.goals ul{margin:0}

.box{border-radius:12px;padding:16px 20px 6px;margin:22px 0;background:var(--panel);border:1px solid var(--line);max-width:none}
.box>b:first-child{display:inline-block;font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:5px;margin-bottom:10px}
.box.key{background:var(--panel2);border-color:#8C8C8C}
.box.key>b:first-child{background:#fff;color:#000}
.box.warn{background:var(--panel);border-color:#8C8C8C;border-style:dashed}
.box.warn>b:first-child{background:transparent;color:#fff;border:1px solid #fff}
.box.tip{background:var(--panel);border-color:var(--line)}
.box.tip>b:first-child{background:#3A3A3A;color:#fff}
.box.def>b:first-child{background:var(--ink);color:var(--bg)}

.fig{margin:30px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fig-h{display:flex;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);font:500 11.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.fig-b{padding:10px 12px 4px;overflow-x:auto}
.fig-b svg{display:block;width:100%;height:auto;min-width:560px}
.fig-c{padding:10px 18px 16px;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.row2>.fig-b+.fig-b{border-left:1px solid var(--line)}
.row2 .fig-b svg{min-width:300px}
.row2 .sub{padding:10px 14px 0;font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

svg text{font-family:var(--f-mono);font-size:11px;fill:var(--ink2)}
svg .halo{paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
svg .b{font-weight:500;fill:var(--ink)}
svg .big{font-size:13px}
.k-liq{--k:var(--liq)} .k-blue{--k:var(--blue)} .k-good{--k:var(--good)} .k-bad{--k:var(--bad)} .k-mute{--k:var(--mute)} .k-ink{--k:var(--ink)}
svg .zone{fill:var(--k);fill-opacity:.15;stroke:var(--k);stroke-opacity:.55;stroke-width:1}
svg .band{fill:var(--k);fill-opacity:.07}
svg .ln{stroke:var(--k);stroke-width:1.5;fill:none}
svg .ln.d{stroke-dasharray:5 4}
svg .kt{fill:var(--k)}
svg text.kt{fill:var(--k);font-weight:500}
svg .tag rect{fill:var(--k)} svg .tag text{fill:#fff;font-weight:500}
svg .k-liq.tag text{fill:#1A1100}
svg .k-liq text.kt{fill:var(--liq-ink)}
svg .k-ink.tag text{fill:#000}
svg .cu{fill:var(--cup);stroke:var(--cup)} svg .cd{fill:var(--cdn);stroke:var(--cdn)}
svg .wk{stroke-width:1.4}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axis{stroke:var(--mute);stroke-width:1}
svg .dot{fill:var(--k);stroke:var(--panel);stroke-width:2}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:26px 0}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative}
.step b{display:block;font:700 17px/1.2 var(--f-display);margin-bottom:6px}
.step em{display:block;font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:10px;font-style:normal}
.step p{font-size:14.5px;line-height:1.5;margin:0;color:var(--ink2)}
.tbl{overflow-x:auto;margin:22px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11.5px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:var(--panel2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}

.wid{margin:30px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.wid-h{padding:14px 20px;border-bottom:1px solid var(--line);font:700 17px/1.2 var(--f-display);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.wid-h span{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.wid-b{padding:18px 20px}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 22px;margin-bottom:16px}
.ctl label{display:block;font:500 12px/1.2 var(--f-mono);letter-spacing:.05em;color:var(--mute);margin-bottom:6px;text-transform:uppercase}
.ctl output{float:right;color:var(--ink);font-weight:500}
.ctl input[type=range]{width:100%;accent-color:#fff}
.ctl input[type=number],.ctl select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:500 15px var(--f-mono)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;font:600 14px var(--f-body)}
.btn.alt{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.liq{background:#fff;color:#000}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.stat small{display:block;font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.stat b{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat.bad{border-style:dashed}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 14px;font:500 13px var(--f-body)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.read{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:15.5px;line-height:1.55;margin-top:12px}

.quiz{margin:50px 0 10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.quiz>h3{margin:0;padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.quiz>h3 span{font:500 12px var(--f-mono);color:var(--mute)}
.qi{padding:20px 22px;border-bottom:1px solid var(--line)}
.qi:last-child{border-bottom:0}
.qi p{font-weight:600;margin-bottom:10px}
.qo{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.qo:hover:not(:disabled){border-color:var(--ink2)}
.qo.ok{background:#fff;color:#000;border-color:#fff;font-weight:600}
.qo.no{background:var(--panel2);border-style:dashed;color:var(--mute);text-decoration:line-through}
.qw{margin-top:8px;font-size:14.5px;color:var(--ink2);display:none}
.qi.answered .qw{display:block}

.recap{margin:44px 0 0;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:26px 30px}
.recap h3{margin:0 0 10px;font-size:13px;font:500 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.recap li{color:var(--ink2)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}
.pager .btn{padding:12px 20px}
.disc{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;line-height:1.5;color:var(--mute);max-width:80ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin:26px 0}
.card{display:block;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:#fff}
.card small{font:500 11px var(--f-mono);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.card b{display:block;font:700 18px/1.2 var(--f-display);margin:6px 0 4px}
.card span{font-size:14px;color:var(--ink2);line-height:1.45;display:block}
.gl dt{font:700 17px var(--f-display);margin-top:20px}
.gl dd{margin:3px 0 0;max-width:70ch;color:var(--ink2)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{margin-top:6px;accent-color:#fff;width:18px;height:18px;flex:none}

@media (max-width:980px){
  #side{transform:translateX(-100%);transition:transform .2s}
  body.menu #side{transform:none}
  #main{margin-left:0}
  #burger{display:block;position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));z-index:40;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 14px;font:600 13px var(--f-body)}
  .page{padding-top:66px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .row2{grid-template-columns:1fr}
  .row2>.fig-b+.fig-b{border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
svg .grid{stroke:var(--line);stroke-opacity:.7}
.fig,.wid,.quiz,.step,.goals,.card,.tbl,.box{box-shadow:none}
#side{background:var(--side)}

body{font-size:clamp(17px,.62vw + 8px,23px)}
h2{font-size:clamp(29px,1.7vw,42px)}
.hd{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(28px,3vw,64px);align-items:start;margin-bottom:6px}
.hd .goals{margin-top:6px}
.read b[style],.read span[style]{color:var(--ink)!important}
.gl{columns:3 340px;column-gap:56px}
.gl dt{break-after:avoid}
.recap ul{columns:1}
@media (min-width:1700px){
  .body .sec{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:clamp(48px,3.4vw,96px);align-items:start}
  .sec>h2{grid-column:1/-1}
  .sec>.tx{grid-column:1}.sec>.vz{grid-column:2}
  .sec.solo>.tx{grid-column:1/-1;columns:2 560px;column-gap:56px}
  .sec.vonly>.vz{grid-column:1/-1}
  .sec.solo .box{break-inside:avoid}
  .tx>:first-child,.vz>:first-child{margin-top:0}
  .tx p,.tx ul,.tx ol{max-width:none}
  .quiz{column-count:2;column-gap:0}
  .quiz>h3{column-span:all}
  .qi{break-inside:avoid}
  .recap ul{columns:2;column-gap:56px}
}
@media (max-width:1100px){.hd{grid-template-columns:1fr}}
</style>

<button id="burger" aria-label="Open course menu">Menu</button>
<aside id="side" aria-label="Course navigation">
  <div class="brand"><b>Liquidity <i>Playbook</i></b><span>A visual study course in futures day trading</span></div>
  <div class="prog" id="prog"></div>
  <nav id="nav"></nav>
  <div class="side-foot"><span>Eastern Time (ET)</span><button id="theme" type="button" hidden>Theme</button><span>Black &amp; white</span></div>
</aside>
<main id="main"></main>
<script>
/* ========== helpers ========== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function K(o,c,wu=1,wl=1){return{o,c,h:Math.max(o,c)+wu,l:Math.min(o,c)-wl}}
function chain(start,list,seed=7){const r=rng(seed);let p=start;return list.map(e=>{let c,wu,wl;if(Array.isArray(e))[c,wu,wl]=e;else c=e;
  if(wu===undefined)wu=.4+r()*.9;if(wl===undefined)wl=.4+r()*.9;const k=K(p,c,wu,wl);p=c;return k})}
function flip(cs,ax){return cs.map(k=>({o:2*ax-k.o,c:2*ax-k.c,h:2*ax-k.l,l:2*ax-k.h}))}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let UID=0;

/* ========== candle chart engine ========== */
function candleChart(sp){
  const cs=sp.c,n=cs.length,W=sp.w||760,H=sp.h||340,uid='m'+(++UID);
  const pd=Object.assign({l:16,r:16,t:30,b:sp.xl?30:16},sp.pad||{});
  let lo=Math.min(...cs.map(k=>k.l)),hi=Math.max(...cs.map(k=>k.h));
  if(sp.y){lo=sp.y[0];hi=sp.y[1]}else{const m=(hi-lo)*.1;lo-=m;hi+=m}
  const iw=W-pd.l-pd.r,ih=H-pd.t-pd.b,st=iw/n,bw=Math.min(24,st*.58);
  const X=i=>pd.l+(i+.5)*st,Y=p=>pd.t+(hi-p)/(hi-lo)*ih;
  const R=p=>{if(typeof p==='number')return p;if(p==='T')return hi;if(p==='B')return lo;
    const m=/^(bt|bb|o|h|l|c)(\d+)([+-][\d.]+)?$/.exec(p);if(!m)throw new Error('bad ref '+p);
    const k=cs[+m[2]];if(!k)throw new Error('no candle '+p);
    const v=m[1]==='bt'?Math.max(k.o,k.c):m[1]==='bb'?Math.min(k.o,k.c):k[m[1]];return v+(m[3]?+m[3]:0)};
  const txt=(x,y,s,cls,anc)=>{const L=String(s).split('\n');
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anc||'start'}" class="halo ${cls||''}">${L.map((t,i)=>`<tspan x="${x.toFixed(1)}" dy="${i?13:0}">${esc(t)}</tspan>`).join('')}</text>`};
  let under='',over='';
  (sp.a||[]).forEach(a=>{const c=a.cls||'k-mute';
    switch(a.t){
    case'zone':{const x1=X(a.i1)-st/2,x2=X(a.i2)+st/2,y1=Y(R(a.p1)),y2=Y(R(a.p2)),t=Math.min(y1,y2),h=Math.abs(y2-y1);
      under+=`<g class="${c}"><rect class="${a.band?'band':'zone'}" x="${x1.toFixed(1)}" y="${t.toFixed(1)}" width="${(x2-x1).toFixed(1)}" height="${h.toFixed(1)}"/></g>`;
      if(a.s){const la=a.la||'tl';const tx=la.includes('r')?x2-6:la==='c'?(x1+x2)/2:x1+6,ty=la.includes('b')?t+h-8:la==='c'?t+h/2+4:t+14;
        over+=`<g class="${c}">${txt(tx,ty,a.s,'kt',la.includes('r')?'end':la==='c'?'middle':'start')}</g>`}break}
    case'hline':{const x1=a.i1==null?pd.l:X(a.i1),x2=a.i2==null?W-pd.r:X(a.i2),y=Y(R(a.p));
      over+=`<g class="${c}"><line class="ln ${a.d===false?'':'d'}" x1="${x1}" x2="${x2}" y1="${y}" y2="${y}"/>`;
      if(a.s){const l=a.la==='l';over+=txt(l?x1+4:x2-4,y+(a.below?15:-6),a.s,'kt',l?'start':'end')}over+='</g>';break}
    case'vline':{const x=X(a.i);over+=`<g class="${c}"><line class="ln d" x1="${x}" x2="${x}" y1="${pd.t}" y2="${H-pd.b}"/>${a.s?txt(x+4,pd.t+10,a.s,'kt'):''}</g>`;break}
    case'text':over+=`<g class="${c}">${txt(X(a.i)+(a.dx||0),Y(R(a.p))+(a.dy||0),a.s,'kt '+(a.big?'big':''),a.anc)}</g>`;break;
    case'tag':{const x=X(a.i)+(a.dx||0),y=Y(R(a.p))+(a.dy||0),w=a.s.length*6.5+14;

function plotLines(sp){

  (sp.yt||[]).forEach(t=>{s+=`<line class="grid" x1="${pd.l}" x2="${W-pd.r}" y1="${Y(t.v)}" y2="${Y(t.v)}"/><text x="${pd.l-8}" y="${Y(t.v)+4}" text-anchor="end">${esc(t.s)}</text>`});
  (sp.xt||[]).forEach(t=>{s+=`<line class="grid" x1="${X(t.v)}" x2="${X(t.v)}" y1="${pd.t}" y2="${H-pd.b}"/><text x="${X(t.v)}" y="${H-pd.b+17}" text-anchor="middle">${esc(t.s)}</text>`});
  s+=`<line class="axis" x1="${pd.l}" x2="${W-pd.r}" y1="${H-pd.b}" y2="${H-pd.b}"/><line class="axis" x1="${pd.l}" x2="${pd.l}" y1="${pd.t}" y2="${H-pd.b}"/>`;
  if(sp.xlab)s+=`<text x="${pd.l+iw/2}" y="${H-6}" text-anchor="middle">${esc(sp.xlab)}</text>`;
  if(sp.ylab)s+=`<text transform="translate(13 ${pd.t+ih/2}) rotate(-90)" text-anchor="middle">${esc(sp.ylab)}</text>`;
  (sp.hl||[]).forEach(h=>{s+=`<g class="${h.cls||'k-mute'}"><line class="ln d" x1="${pd.l}" x2="${W-pd.r}" y1="${Y(h.v)}" y2="${Y(h.v)}"/>${h.s?`<text class="kt halo" x="${W-pd.r-4}" y="${Y(h.v)-6}" text-anchor="end">${esc(h.s)}</text>`:''}</g>`});
  (sp.s||[]).forEach(q=>{const pts=q.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');

    s+=`<g class="${q.cls}"><polyline class="ln ${q.d?'d':''}" style="${q.w?'stroke-width:'+q.w:''}" points="${pts}"/>${q.s?`<text class="kt halo" x="${X(q.pts[q.pts.length-1][0])-4}" y="${Y(q.pts[q.pts.length-1][1])-8}" text-anchor="end">${esc(q.s)}</text>`:''}</g>`});
  (sp.p||[]).forEach(p=>{s+=`<g class="${p.cls||'k-liq'}"><circle class="dot" cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r||5}"/>${p.s?`<text class="kt halo" x="${X(p.x)+(p.dx??9)}" y="${Y(p.y)+(p.dy??-9)}" text-anchor="${p.anc||'start'}">${esc(p.s)}</text>`:''}</g>`});
  return s+'</svg>'}

lead:'Before any chart or setup, you need a working definition of the job. Get this wrong and every later concept gets used for the wrong purpose.',
goals:['State a precise, useful definition of day trading','Explain why chasing money is the fastest way to trade badly','Describe long and short trades and how each makes a profit','Name the three skill sets every profitable trader needs'],
html:`
<h2>A definition worth memorising</h2>
<p>Day trading is the ability to predict, with high probability, where the price of an asset is going to go on a given day. Making money is what happens when that ability is good and well managed. It is a by-product, not the skill itself.</p>
${KEY('<p>You are not trying to "make money". You are trying to become reliably good at predicting daily price delivery, then taking only the trades where the odds clearly favour you. Profit is the output of that process.</p>')}
<h3>There is no skill called "being good at making money"</h3>
<p>People who earn large amounts have developed specialised skills the market pays for. Money is the reward the market attaches to a skill. When a beginner keeps their eyes on the money, three things happen: anxiety rises, fear of missing out (FOMO) grows, and decisions turn impulsive. When attention stays on technical execution, those pressures fade and the money question answers itself over time.</p>
<h2>Long and short: two ways to profit</h2>
<p>You can profit from price rising or falling. A <b>long</b> (buy) trade profits when you buy low and later sell higher. A <b>short</b> (sell) trade works in reverse: you sell first at a high price, then buy back lower. Either way you are doing the same thing, buying low and selling high, in a different order.</p>
${F2('longshort1','longshort2','Both trades capture the same distance. Direction does not matter, being right about direction does.','Long: buy low, sell high','Short: sell high, buy back low','Two ways to profit')}
<h2>Technical vs fundamental traders</h2>
<p>There are two broad schools. <b>Fundamental</b> traders and investors study news, earnings and macro data, and usually hold for long periods. <b>Technical</b> traders read price itself and act on what the chart shows. Day traders in this course are technical: they buy low and sell high (or sell high and buy back low) within the day, so the first requirement is being able to <em>see</em> price properly. That is Module 2.</p>
<h2>Mechanics beat memorised patterns</h2>
<p>A common beginner approach is to memorise chart patterns such as head and shoulders or double tops, or to draw support and resistance lines and hope price bounces. The problem is the missing "why". A pattern tells you what a chart looked like on other days, not why orders are moving price right now.</p>
<p>This course builds the opposite habit. You will always ask: where are orders waiting, were they filled, and is the new direction continuing? That is a <b>mechanical</b> view of the market. Everything that follows (liquidity, structure, imbalances, time) is a tool for answering those three questions.</p>
${WARN('<p>Believing you will become rich in a few months. That expectation pushes people to force setups, raise leverage and break rules, which guarantees account failure. Treat it like a skill that takes years, because it does.</p>')}
<h2>The three skill sets</h2>
<p>Strategy alone does not make a trader. You need all three of the following, and a weakness in any one will cap your results.</p>
${F('pillars','Remove any pillar and the roof falls. Most beginners spend 100% of their time on the first one.','The foundation')}
<h2>How to learn this properly</h2>
<p>Watching lessons gives you information. Information is step one of a longer loop. The skill that separates profitable traders is built by repetition on charts, mistakes, review, and more repetition.</p>
${steps([['Step 1','Study','Learn one concept and its exact rules.'],['Step 2','Mark','Find 10 real examples on past charts and mark them.'],['Step 3','Backtest','Replay the market and "trade" the concept with fixed rules.'],['Step 4','Journal','Log every trade with screenshots, reasoning and outcome.'],['Step 5','Review','Find your repeated mistakes. Fix one at a time.']])}
<p>The instructor compares this to a basketball star sharing his training plan. The plan helps, but only the person who does the work gets the result. Plan on hundreds of hours of screen time before you judge your own ability.</p>`,

WID.candleBuilder=el=>{
  const cs=chain(100,[101.2,102.6,101.4,100.2,99,100.4,102.2,103.9,105.3,104.2,106.1,107],21);
  el.innerHTML=`<div class="wid-h">Candle builder: five-minute candles become a one-hour candle<span>Interactive</span></div><div class="wid-b"><div class="ctl"><div><label for="cbN">Five-minute candles included <output id="cbO"></output></label><input id="cbN" type="range" min="1" max="12" value="12"></div></div><div style="display:grid;grid-template-columns:2.4fr 1fr;gap:14px;align-items:end"><div id="cbL"></div><div id="cbR"></div></div><div class="stats" id="cbS"></div><div class="read" id="cbT"></div></div>`;
  const draw=()=>{const n=+$('#cbN',el).value,part=cs.slice(0,n);$('#cbO',el).textContent=n+' of 12 ('+(n*5)+' min)';
    const agg={o:part[0].o,c:part[n-1].c,h:Math.max(...part.map(k=>k.h)),l:Math.min(...part.map(k=>k.l))},up=agg.c>=agg.o;
    $('#cbL',el).innerHTML=candleChart({c:cs.map((k,i)=>i<n?k:Object.assign({},k,{cls:'cm'})),w:560,h:290,y:[96,112],alt:'Twelve five-minute candles',pad:{t:14,b:14},a:[{t:'text',i:0,p:112,dy:0,s:'5-minute chart',cls:'k-mute'}]});
    $$('.cm',el).forEach(g=>{g.style.opacity='.18';g.style.fill='var(--mute)';g.style.stroke='var(--mute)'});
    $('#cbR',el).innerHTML=candleChart({c:[agg],w:210,h:290,y:[96,112],alt:'The resulting hourly candle',pad:{t:14,b:14,l:30,r:60},a:[{t:'text',i:0,p:112,s:'Hourly candle',cls:'k-mute',anc:'middle'}]});
    $('#cbS',el).innerHTML=[['Open (first 5m open)',agg.o],['High (highest high)',agg.h],['Low (lowest low)',agg.l],['Close (last 5m close)',agg.c]].map(r=>`<div class="stat"><small>${r[0]}</small><b>${r[1].toFixed(2)}</b></div>`).join('');
    $('#cbT',el).innerHTML=`This candle is <b>${up?'bullish (up)':'bearish (down)'}</b>. Its body spans ${Math.abs(agg.c-agg.o).toFixed(2)} points while the full range is ${(agg.h-agg.l).toFixed(2)}. Every higher time frame candle is just many smaller candles summarised into four numbers.`};
  $('#cbN',el).addEventListener('input',draw);draw()};
PAGES.push({id:'m02',part:'I',n:2,title:'Reading the Chart',min:18,level:'Foundation',src:'Source: lesson "How to Read a Candlestick Chart"',
lead:'Every concept in this course is drawn on candlesticks. This module makes sure you can read them fluently: anatomy, time frames, swing points and trends.',
goals:['Set up a clean TradingView chart on Eastern time','Name the four prices every candle records','Explain how a higher time frame candle is built from lower ones','Identify swing highs, swing lows and the direction of a trend'],
html:`
<h2>Set up your chart first</h2>
<p>The instructor uses TradingView because it has the cleanest interface and almost every active day trader uses it. A free account is enough to begin. After signing up, open <em>Supercharts</em> to get a full chart. Then make three changes.</p>
<ol><li><b>Set the time zone to Eastern Time (New York).</b> Futures index markets run on New York time. Open is 9:30 a.m. Eastern wherever you live. If your chart is in another zone, every session and time rule in this course will land on the wrong candle.</li>
<li><b>Use neutral candle colours.</b> Green and red tie directly to feelings about winning and losing money, which works against the detachment you want. Blue and black (or white and black) keep candles informational. This course draws up candles in white and down candles in grey for the same reason.</li>
<li><b>Strip the clutter.</b> A white background, no grid lines and no indicators is enough. Indicators are used later only to mark levels, never to decide trades.</li></ol>
${TIP('<p>Do not buy a paid plan to start. Free is enough until you know exactly which feature you are missing.</p>')}
<h2>Anatomy of a candle</h2>
<p>A Japanese candlestick records four prices for one slice of time: where price <b>opened</b>, the <b>highest</b> price reached, the <b>lowest</b> price reached, and where it <b>closed</b>. The thick part is the <b>body</b> (open to close). The thin lines are <b>wicks</b>, traces left where price travelled but did not finish.</p>
${F('anatomy','On an up candle the open is the bottom of the body and the close is the top. On a down candle it is reversed. The wicks always show the high and the low.','Candlestick anatomy')}
<p>Other chart types exist (bars, line, Heikin-Ashi, Renko, footprint). Japanese candles are the standard here because they hold all four prices and make wicks visible, and wicks matter a great deal for liquidity, structure and gaps.</p>
<h2>Time frames: the same market at different zoom levels</h2>
<p>The time frame is the amount of time one candle covers. On a daily chart one candle is 24 hours. On a 5-minute chart each candle is 5 minutes. A 1-hour candle is just twelve 5-minute candles compressed. Use the builder below and watch the four numbers of the hourly candle change as more small candles are included.</p>
${W_('candleBuilder')}
<p>You will use several time frames together: higher ones (4-hour, 1-hour) to see direction and major levels, lower ones (15-minute, 5-minute, 1-minute) to time entries. The same patterns appear on all of them.</p>
<h2>Swing highs, swing lows and trends</h2>
<p>A <b>swing high</b> is a peak: a candle whose high is above the highs on either side. A <b>swing low</b> is the matching trough. A trend is nothing more than the sequence of those swings.</p>
${F2('trendUp','trendDown','Follow the swing points, not individual candles. Uptrends step up, downtrends step down. Each label marks the swing relative to the one before it.','Uptrend: higher highs (HH) and higher lows (HL)','Downtrend: lower highs (LH) and lower lows (LL)','Market structure')}
<p>When swings stop stepping in one direction the trend is in question. That is the subject of Module 5 (break of structure). For now your homework is to scroll through any chart, mark every swing high and low, and label the trend. Do it on three time frames.</p>
${WARN('<p>Reading a trend from the last two or three candles. Always zoom out until you can see at least three swing points on the same side.</p>')}`,
recap:['Set TradingView to Eastern Time. Keep the chart clean and neutral.','A candle = open, high, low, close. Body shows open to close, wicks show the extremes.','Higher time frame candles summarise lower ones. Use several time frames together.','Swing highs and lows define trends: HH+HL is up, LH+LL is down.']});

PAGES.push({id:'m03',part:'II',n:3,title:'Liquidity Explained',min:20,level:'Core concept',src:'Source: lesson "Liquidity Explained"',
lead:'Liquidity is the centre of this whole approach. If you understand who is waiting where, price movement stops looking random.',
goals:['Define liquidity as resting orders and say exactly where it sits','Explain why large players need counterparties and where they find them','Describe a liquidity sweep and why it is only an opportunity','Avoid entering blindly at every high or low'],
html:`
<h2>What liquidity actually is</h2>
<p>Liquidity is the set of orders waiting in the market: buy stops, sell stops, buy limits and sell limits. Price only moves when orders are executed. If nobody trades, price stays flat. So the key question at any moment is: <em>where are the orders, and who is likely to trigger them?</em></p>
${DEF('Definition','<p><b>Liquidity</b> = resting orders sitting above and below price. Where orders cluster, price is drawn to them, because that is where large positions can be filled.</p>')}
<h2>Where the orders sit</h2>
<p>Look at any obvious swing high. Two groups have resting <b>buy</b> orders just above it:</p>
<ol><li><b>Breakout buyers.</b> Traders who plan to buy when price breaks above the old high.</li>
<li><b>Short sellers' stop-losses.</b> Anyone who shorted during the fall from that high placed a protective stop above it, and a stop on a short is a buy order.</li></ol>
<p>Below any obvious swing low the mirror image exists: breakout sellers, and the stop-losses of traders who bought during the rise (a stop on a long is a sell order). Highs and lows are not just numbers on a chart. They are stacks of pending orders.</p>
${F('liqwho','Every clear swing high holds a pool of buy orders above it, and every clear swing low holds a pool of sell orders below it.','Where resting orders live')}
<h2>Why large players hunt these pools</h2>
<p>An order only fills if someone takes the other side. A retail trader can buy 1 contract almost anywhere. A large institution that needs to buy thousands cannot simply click: it would push the price up against itself (slippage). To buy big, it needs a big pool of sellers. Where is the biggest pool of sellers? Below the lows. To sell big, it needs buyers, and the biggest pool of buyers is above the highs.</p>
${steps([['Retail view','Breakouts','Price above the high looks bullish, so buy. Price below the low looks bearish, so sell.'],['Large-player need','Counterparties','To sell a huge position it needs lots of buyers at one price.'],['The result','Sweep','Price is pushed through the high to trigger those buyers, filling the big seller, and may then fall.']])}
<p>This is the "reverse psychology" of the market: the obvious breakout is often the moment the big order is being filled on the other side.</p>
<h2>The liquidity sweep</h2>
<p>A <b>sweep</b> (also called a stop run or manipulation) is a push through a swing high or low that activates the resting orders there. After a sweep, price may reverse sharply, or it may keep going. The sweep itself only tells you that a big opportunity to fill orders existed.</p>
${F2('sweepRev','sweepCont','The same sweep, two outcomes. On the left, price takes the high and reverses. On the right, it takes the high and continues up.','Outcome A: reversal','Outcome B: continuation','A sweep is an opportunity, not a signal')}
${KEY('<p>Liquidity gives price the <b>opportunity</b> to reverse. It never promises a reversal. You need further evidence that the opportunity was actually taken, which is what the next modules teach.</p>')}
${WARN('<p>Placing a limit sell above every high and a limit buy below every low. Price often sweeps a level and keeps trending, and blind entries turn into heavy drawdowns. Wait for confirmation.</p>')}
<h2>Invalidation points and why they matter</h2>
<p>In an uptrend the previous swing low is where the trend is "invalidated": below it, structure has shifted. Beginners place stops exactly there, which is why those lows are packed with sell orders. Knowing where the crowd puts stops tells you where price is being drawn.</p>
<h2>Marking liquidity: a repeatable routine</h2>
<ol><li>Find the clear swing highs and swing lows on the chart.</li><li>Mark buy-side liquidity above highs and sell-side below lows.</li><li>Watch how price interacts with the level. Does it pierce and close back, or accept beyond?</li><li>Look for signs that large orders were absorbed (Modules 5 to 9).</li><li>Only then consider an entry. Entries, stops and targets come later in the course.</li></ol>`,
recap:['Liquidity = resting orders. Buy orders above highs, sell orders below lows.','Highs hold breakout buyers plus the stops of shorts. Lows hold breakout sellers plus the stops of longs.','Large players need counterparties, so they target the biggest pools.','A sweep is an opportunity to reverse, not a guarantee. Never fade every high or low blindly.']});

{q:'Why would a large buyer want price to move below an obvious low?',o:['To scare the market','Because the pool of sell orders there lets them fill a large buy without much slippage','Because lows are always the end of the trend','It does not, they only buy breakouts'],a:1,w:'Sell orders below lows are the counterparties the buyer needs.'},

PAGES.push({id:'m04',part:'II',n:4,title:'Advanced Liquidity Concepts',min:26,level:'Core concept',src:'Source: lesson "Advanced Liquidity Concepts"',
lead:'Not every high and low is equally important. This module ranks the draws on liquidity so you know which ones price is most likely to reach for, and use them as both entries and targets.',
goals:['Mark the Asia, London and New York session highs and lows on Eastern time','Use previous day high and low as higher-probability levels','Recognise stacked ("low resistance") and equal highs and lows','Use news candle highs and lows as liquidity'],
html:`
<p>In the last module you learned that liquidity sits above highs and below lows. A chart has dozens of highs and lows, so which ones matter? The course gives you five families. Each can be an <b>entry</b> (where a sweep may start a reversal) or a <b>target</b> (where an open position can be closed because many orders wait there).</p>
${tbl(['#','Draw on liquidity','Why it is stronger'],[['1','Session highs and lows','New money from a new region arrives each session'],['2','Previous day high and low','All three sessions combined into one level'],['3','Low resistance (stacked) highs/lows','Several untouched pools in a row'],['4','Relative equal highs/lows','Two sets of orders at one price'],['5','News (data) highs/lows','Volatile candle edges after scheduled data']])}
<h2>1. Session highs and lows</h2>
<p>The 24-hour day splits into three sessions, each driven by traders in a different region. When a new session opens, new money enters. That money often targets the highs and lows the previous session just created, because they hold resting orders. Set your chart to Eastern time and use these windows.</p>
${W_('sessions')}
<p>A typical sequence: Asia builds a range. London opens and pushes below the Asia low to fill buy orders, then rallies and takes the Asia high where it can sell. New York then arrives, pushes above the London high, and heads for the London low. It does not happen every day, but when it does the map is clear.</p>
${F('sessionDay','Illustrative day. Each new session sweeps the extreme of the previous session before heading for the other side. Red dots mark the sweeps; arrows show the delivery that followed.','Money shifting session to session')}
${TIP('<p>Use a session indicator (many are free on TradingView) to draw session highs and lows automatically, then always verify the session start times against the table above.</p>')}
<h2>2. Previous day high and low</h2>
<p>The previous day high (PDH) is simply the highest point of all three sessions combined, and the previous day low (PDL) the lowest. They are the same idea scaled up, and they are watched by almost everyone.</p>
${F('pdhl','Today pushes above PDH, takes the buy orders there, and then delivers to PDL. This is a pattern, not a rule: do not press sell every time price touches PDH.','Previous day levels')}
<h2>3. Low resistance liquidity: the cookie jar</h2>
<p>When a trend leaves several swing lows (or highs) stacked in a row and untouched, each one is another pool. Once a large player has sold into a sweep at the top, there is no reason to stop at the first low. Every stacked low is another jar of cookies, and the market is greedy.</p>
${F('lowres','Three stacked lows below a swept high. The decline runs through all of them. The same structure inverted works for stacked highs in a downtrend.','Stacked highs and lows')}
<p>These also work in reverse. If price has just run through a stack of lows, a lot of sell orders have been filled. That fuel can power a rise, which is why stacked levels serve as entries <em>and</em> as exits.</p>
<h2>4. Relative equal highs and lows</h2>
<p>When two highs sit at the same price (or within a few ticks), the buy orders above them are doubled: stops of traders who shorted from each peak, plus breakout buyers waiting on the line. That makes equal highs and lows especially attractive to sweep.</p>
${F('eqh','Two peaks at one price (115). One sweep captures both sets of orders.','Equal highs')}
<h2>5. News data highs and lows</h2>
<p>Scheduled economic reports (CPI, PPI, jobless claims, FOMC) cause violent candles, mostly at 8:30 a.m. Eastern. The high and low of that candle become liquidity for the rest of the day. Use a free economic calendar and look for the red-folder (high impact) events.</p>
${F('newsdl','The edges of the 8:30 news candle act like any other high and low. Here the data high is swept, then the data low is taken.','News candle as liquidity')}
${WARN('<p>Treating any of these levels as a trigger by itself. "Price touched PDH, so I sell" is the same blind entry as before. A level only gives the opportunity. Confirmation comes from the next modules.</p>')}
<h2>Homework</h2>
<ul><li>Mark Asia, London and New York highs and lows for the last 10 trading days.</li><li>For each day note which one was swept first and where price went afterward.</li><li>Repeat for previous day high/low, equal highs/lows and two news days.</li></ul>`,
recap:['Rank draws on liquidity: sessions, previous day, stacked, equal, news.','Session times (ET): Asia 18:00-03:00, London 03:00-08:30, New York 08:30 pre / 09:30 open.','New sessions tend to sweep the previous session, then head for the opposite extreme.','Stacked or equal levels hold more orders and attract price harder.','Every level is both an entry area and a target. None is a standalone signal.']});

PAGES.push({id:'m05',part:'III',n:5,title:'Break of Structure',min:16,level:'Core concept',src:'Source: lesson "Break of Structure Explained"',
lead:'Liquidity tells you where orders may be filled. Break of structure tells you whether they actually were. It is the first and simplest confirmation tool.',
goals:['Define bullish and bearish market structure precisely','Identify which swing point to monitor at any moment','Distinguish a wick through a level from a true candle close','Explain how a break of structure confirms a liquidity sweep'],
html:`
<h2>Market structure in one paragraph</h2>
<p>An uptrend is a series of higher highs and higher lows; that is <b>bullish market structure</b>. A downtrend is lower highs and lower lows; <b>bearish market structure</b>. A <b>break of structure (BOS)</b> is the moment the current structure fails: the market stops doing what it has been doing and starts doing the opposite.</p>
<h2>The rule</h2>
${KEY('<p><b>To break bullish structure</b> a candle must <b>close</b> below the <b>most recent swing low</b>. <b>To break bearish structure</b> a candle must <b>close</b> above the <b>most recent swing high</b>.<br>Wicks do not count. Older swings do not count. Only the most recent one in the trend counts.</p>')}
<p>Think of it as monitoring one line at a time. In an uptrend you watch the latest low (highs do not matter for breaking). In a downtrend you watch the latest high. When the monitored swing is replaced by a new one, the line moves with it.</p>
${W_('bosTest')}
<h2>Seeing it on a chart</h2>
${F2('bosSweep','bosBull','A sweep of liquidity (step 1) followed by a candle close beyond the most recent opposite swing (step 2). The left example breaks down, the right example breaks up.','Bearish BOS after a high is swept','Bullish BOS after a low is swept','Sweep + break of structure')}
<h2>Common traps</h2>
<ul><li><b>Lower high alone.</b> In an uptrend, one lower high is not a break. You are only watching lows for a bearish break.</li>
<li><b>Using the wrong low.</b> A drastically lower low whose candle did not <em>close</em> beyond the monitored low is still not a break. Keep monitoring.</li>
<li><b>Closing exactly at the line.</b> If the body only equals the level, it is not a close below. Wait for a candle that clearly closes beyond.</li></ul>
${WARN('<p>Selling the instant a wick pokes through a low. The moment before a real BOS often looks identical to a sweep. The candle close is the filter.</p>')}
<h2>Where it fits in the strategy</h2>
<p>Here is the logic in the instructor's own sequence. Liquidity gives the <em>opportunity</em> for orders to be filled. A BOS on a lower time frame is the <em>confirmation</em> that they were filled: after taking a high, the market changed from making higher lows to breaking one. That is why the lesson calls it a <b>confirmation confluence</b>.</p>
<p>It is still not a trade on its own. The new trend might be only a retrace inside a bigger move, so you also want proof that the new direction continues. That is the job of the next confluences.</p>`,
recap:['Bullish structure = HH + HL. Bearish = LH + LL.','A BOS needs a candle CLOSE beyond the most recent swing in the trend. Wicks do not count.','In an uptrend monitor the latest low. In a downtrend monitor the latest high.','BOS is a confirmation confluence: it confirms orders were filled after a sweep.','It is never a trade by itself.']});

{q:'In a downtrend, which swing do you monitor for a bullish BOS?',o:['Any old high','The most recent high','The most recent low','The 50% level'],a:1,w:'A bullish break needs a close above the most recent swing high of the downtrend.'},

PAGES.push({id:'m06',part:'III',n:6,title:'Fair Value Gaps',min:24,level:'Core concept',src:'Source: lesson "Fair Value Gaps Explained"',
lead:'Price is always doing one of two things: taking liquidity, or filling an imbalance. Fair value gaps are the imbalance half, and your first tool for judging whether a new move will continue.',
goals:['Identify bullish and bearish FVGs from the wicks of three candles','Explain why a gap means orders are thin on one side','Tell a real FVG from overlapping wicks','Handle stacks of gaps and know when to delete them'],
html:`
<h2>Definition</h2>
<p>A <b>fair value gap (FVG)</b>, also called an <b>imbalance</b>, is a three-candle pattern. A strong middle candle moves price quickly in one direction, leaving a zone between the first candle's wick and the third candle's wick where little or no trading happened.</p>
<ul><li><b>Bullish FVG:</b> the high of candle 1 is <em>below</em> the low of candle 3. The gap is the space between them.</li><li><b>Bearish FVG:</b> the low of candle 1 is <em>above</em> the high of candle 3.</li></ul>
${F2('fvgBull','fvgBear','Use only the wick tips of candles 1 and 3. The colour of candles 1 and 3 is irrelevant. The middle (expansion) candle is the one that creates the gap.','Bullish FVG','Bearish FVG','Three-candle imbalance')}
<h2>Why a gap is meaningful</h2>
<p>Look at candle 1 in the bullish example: price rose, then sellers pushed it back, so a stack of sells existed up to its high. Candle 3: buyers pushed price from below up through this zone. Between those two wicks, nobody sold into the move. The expansion candle simply ran through the empty space, meaning <b>sell orders were scarce</b> in that range. In a bearish FVG the scarce side is buy orders.</p>
<p>If price comes back into the gap and buyers appear, the lack of sellers above means price can move on without resistance. That is why a gap acts as a <b>continuation confluence</b>: it shows the trend can keep going.</p>
${W_('fvgLab')}
<h2>What is not a fair value gap</h2>
${F('fvgNot','The lower wick of candle 3 reaches below the upper wick of candle 1. The wicks overlap, so orders traded in the whole range. There is no imbalance.','Overlap = no FVG')}
<p>The instructor also does not trade classic candlestick patterns such as head and shoulders or double tops. The criticism is simple: those patterns say what a chart looked like, but they do not say <em>why</em> price moved. An FVG has a reason attached to it: a measurable lack of orders.</p>
<h2>When a gap is disrespected</h2>
<p>A gap is respected when price enters it and moves away in the trend direction. It is <b>disrespected</b> when a candle <b>closes</b> beyond it on the far side (the same candle-close rule as break of structure; wicks do not count). A disrespected gap is no longer valid. In the next two modules you will see that this failure is itself a signal.</p>
<h2>Stacks of gaps</h2>
<p>Strong moves often leave several gaps with no retracement between them. While they are stacked, all of them remain valid. Price may use any one of them, and closing through the first does not mean the trend is over because deeper gaps can still catch it.</p>
<p>Once price taps a gap and then pushes on to a new high (or low in a downtrend), that imbalance has done its job. <b>Delete every gap beneath the move.</b> Do not drag old gaps forward and expect them to work weeks later. The same is true for gaps price never needed: if the trend resumes without touching them, they are finished too.</p>
${F('fvgStack','Two stacked gaps. Price uses FVG #2 and rises to a new high. Neither gap should remain on the chart afterward.','Gap stack and clean-up')}
${WARN('<p>Leaving stale gaps on the chart. Later price drifts into an old gap, you short it expecting a reaction, and you get stopped out. The gap was already used.</p>')}
${WARN('<p>Pressing buy or sell the moment price touches a gap. If the candle is still forming, price can run straight through. Wait for evidence of a reaction before entering.</p>')}`,
recap:['FVG = three candles where the wicks of 1 and 3 do not overlap. Colours do not matter.','The gap marks a range where one side of orders is missing. It is a continuation confluence.','Overlapping wicks = no gap. Close beyond a gap = gap disrespected.','Stacked gaps stay valid until the trend moves on. Then delete them all.','Never trade a gap touch blindly. Look for the reaction.']});

PAGES.push({id:'m07',part:'III',n:7,title:'Advanced Imbalance Concepts',min:20,level:'Advanced',src:'Source: lesson "Advanced Imbalance Concepts"',
lead:'Fair value gaps are only one kind of imbalance. Opening gaps and balanced price ranges also pull price, and knowing them gives you extra targets and entries.',
goals:['Recognise new-day, new-week and new-candle opening gaps','Rank them by usefulness','Explain what a BPR is and why a revisit tends to be fast','Use imbalances as both targets and entries'],
html:`
<p>Every imbalance is a place where price moved so quickly that a range was left lightly traded. Price tends to come back to balance it, then continue. These are not required to fill, and they are not guaranteed to react, but they carry a high probability and give the chart extra structure.</p>
${tbl(['Type','What it is','How useful'],[['New day opening gap (NDOG)','Gap between the previous day close and the next day open (about one hour of no trading)','Occasional. Often fills during Asia, which this course does not trade'],['New week opening gap (NWOG)','Gap between Friday close and Sunday open (about two days with no trading)','Better. Larger and often still open on Monday morning'],['New candle opening gap','Gap between consecutive candle close and open on any time frame','Almost useless. Markets are continuous, so these are tiny'],['BPR (balanced price range)','A swift move up through imbalance followed by a swift move down through it','Useful as a target or entry zone']])}
<h2>Opening gaps</h2>
<p>The market closes at 17:00 ET for one hour each day and for the weekend (Friday close to Sunday afternoon). If the next open is at a different price, the space between is an imbalance. Price is usually keen to revisit it quickly, then continue in its own direction.</p>
${F('ndog','Friday close at 100, Sunday open at 104.5. The very first candle drops to fill the gap, then price carries on higher.','Weekend opening gap (NWOG)')}
<p>You can use an opening gap in two ways. As a <b>target</b>: if price is far above a gap, the gap is a likely destination. As an <b>entry</b>: when price comes into the gap and shows a reaction, look for the continuation. Weekly gaps are the practical ones because Sunday trading is stagnant, so Monday often gives time to act.</p>
${TIP('<p>If a weekly gap is not filled in the first hours of the week, it becomes a high-probability target for Monday and Tuesday.</p>')}
<h2>New candle opening gaps</h2>
<p>These are the same idea on any time frame, but with no real time between one candle's close and the next open, they only appear on very small time frames and span a few ticks. The instructor describes them as nearly useless. Know they exist, then move on.</p>
<h2>BPR: balanced price range</h2>
<p>Sometimes price makes a swift move up through a series of imbalances, then a swift move down through the same area. The whole range was crossed with no resistance twice, so it is an illiquid range. When price re-enters it later, it tends to travel through just as quickly as before, and it often continues in its original direction afterward.</p>
${F('bpr','A swift rise and an equally swift decline create a thin range. On a revisit, price crosses it fast in both directions. Use it as a target or as an area to look for entries.','Balanced price range')}
<p>The instructor shared a New York trade that was taken off a BPR: a short on NASDAQ around 10:41 a.m., targeting the bottom of the range because once price re-entered it, it could drop through just as it had risen. Bearish confirmation was needed first. The imbalance told him where the trade could go, not when to enter.</p>
${KEY('<p>Price is always moving to take <b>external liquidity</b> (highs and lows) or to fill <b>internal liquidity</b> (imbalances). Fair value gaps, opening gaps and BPRs are the internal kind.</p>')}`,
recap:['Imbalances are price ranges left lightly traded. Price tends to revisit them.','NWOG > NDOG > new candle gap in usefulness.','A BPR = swift move up and swift move down through the same area. A revisit is usually fast.','All imbalances can act as targets or entries, never as standalone signals.']});

{q:'Why is the weekend (NWOG) gap more practical than the daily one?',o:['It is larger and often still open Monday morning','It always fills instantly','Sunday has heavy volume','It is the same as NDOG'],a:0,w:'Bigger gap, more time for action before the US session.'},

PAGES.push({id:'m08',part:'III',n:8,title:'Inverse Fair Value Gaps',min:22,level:'Advanced',src:'Source: lesson "Inverse Fair Value Gaps Explained"',
lead:'A fair value gap that fails is not just a dead gap. It is information. When a continuation signal is ignored, the trend it protected is probably over, and you often learn that earlier than a break of structure would tell you.',
goals:['Classify each confluence as reversal, confirmation or continuation','Identify an inverse FVG and apply the candle-close rule','Explain why an inverse gap can beat a break of structure','Choose the correct gap in a stack for the inverse test'],
html:`
<h2>Classifying the tools you have</h2>
<p>You now know enough confluences to sort them by job. This vocabulary is the backbone of the strategy.</p>
${tbl(['Job','Question it answers','Tools so far'],[['Reversal / opportunity','Is there a chance that orders can be filled and a move can turn?','Liquidity: highs, lows, sessions, equal levels'],['Confirmation','Did orders actually get filled and the trend change?','Break of structure, inverse FVG'],['Continuation','Will the new trend keep going?','Fair value gap, equilibrium (next module)']])}
<h2>The idea</h2>
<p>A fair value gap in a trend is supposed to be respected: price tags it and moves on. If instead a candle <b>closes through the gap</b>, the continuation tool has failed. The market did not do what that trend would do, which suggests a change of direction. That makes a failed gap a <b>confirmation</b> confluence.</p>
${F('ifvg','A bearish gap should push price lower. Instead a candle closes above it, flipping the gap into support. Price retests it, holds, and trends up.','Inverse fair value gap')}
${KEY('<p>An <b>inverse FVG</b> is a gap that is closed through by a full candle body. The same rule as break of structure applies: wicks do not count, the candle must close beyond.</p>')}
<h2>Why it is useful: earlier information</h2>
<p>An inverse gap often triggers <em>before</em> a break of structure is available. A BOS needs a close beyond the last swing, which may still be far away. A gap sits near price, so its failure can show up one or two candles earlier. Entering there, rather than after the BOS, can move your entry far closer to the turning point.</p>
${F('ifvgCompare','Lesson example on a 4-hour chart: entering on the inverse gap would have been about 68 ticks better than waiting for the BOS. In a second example the saving was 123 ticks.','What earlier information is worth')}
<p>That difference does two things: your stop shrinks, and your reward-to-risk improves. The lesson walks through $1,000 of risk earning $1,300 on the early entry versus only about $450 on the late one.</p>
<h2>Stacks: which gap must invert?</h2>
<p>With several gaps stacked, closing through the <em>top</em> one means nothing, because lower ones can still hold the trend. For an inverse signal in an uptrend you need the <b>lowest gap</b> to be closed below. For a downtrend, the highest gap must be closed above.</p>
${F('ifvgStack','Closing below the upper gap leaves the lower gap available to hold the trend. Only the close below the lowest gap marks the trend as finished.','Stack rule')}
${WARN('<p>Treating every inverse gap as a trade. The instructor is explicit: you cannot sell every inverse bearish signal and buy every inverse bullish one. It is a confirmation tool, valuable only when it follows a real opportunity such as a liquidity sweep.</p>')}
<h3>The full chain so far</h3>
${steps([['1  Opportunity','Liquidity','Price sweeps a high or low, so orders could be filled.'],['2  Confirmation','BOS or inverse FVG','Evidence that the move did turn.'],['3  Continuation','FVG or equilibrium','Evidence that the new trend keeps going.']])}`,
recap:['Reversal = liquidity. Confirmation = BOS and inverse FVG. Continuation = FVG and equilibrium.','An inverse FVG is a gap closed through by a candle body, not a wick.','It often triggers before a BOS, improving entry, stop size and reward-to-risk.','In a stack, the farthest gap in the trend direction must invert.','Never trade an inverse FVG without a preceding opportunity.']});

  el.innerHTML=`<div class="wid-h">Premium or discount? Test your entry price<span>Interactive</span></div><div class="wid-b"><div class="seg" id="eqD"><button type="button" aria-pressed="true" data-d="up">Uptrend (looking to buy)</button><button type="button" aria-pressed="false" data-d="dn">Downtrend (looking to sell)</button></div>

    $('#eqO',el).textContent=p.toFixed(1)+(p===110?' (exactly EQ)':disc?' (discount)':' (premium)');
    $('#eqS',el).innerHTML=`<svg viewBox="0 0 760 130" role="img" aria-label="Premium and discount bar"><rect x="40" y="46" width="340" height="30" fill="var(--good)" fill-opacity=".25"/><rect x="380" y="46" width="340" height="30" fill="var(--bad)" fill-opacity=".25"/><line x1="380" x2="380" y1="34" y2="88" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 3"/><text x="380" y="26" text-anchor="middle" class="b">EQ 110 (50%)</text><text x="40" y="106">${d==='up'?'swing low 100':'swing low 100 (target)'}</text><text x="720" y="106" text-anchor="end">${d==='up'?'swing high 120 (target)':'swing high 120'}</text><text x="210" y="66" text-anchor="middle" style="fill:var(--good);font-weight:500">DISCOUNT</text><text x="550" y="66" text-anchor="middle" style="fill:var(--bad);font-weight:500">PREMIUM</text><path d="M${x(p)} 80 l-9 16 h18z" fill="var(--liq)" stroke="var(--panel)" stroke-width="2"/></svg>`;
    let msg;if(d==='up')msg=disc?`<b style="color:var(--good)">Discount.</b> In an uptrend, price below EQ is where buyers (and large players) want to accumulate. This is the area to look for a buy once you see confirmation.`:`<b style="color:var(--bad)">Premium.</b> Buying here is topping up at an expensive price. Wait for price to retrace below EQ. Market makers will not want to add longs this high either.`;
    else msg=disc?`<b style="color:var(--good)">Discount for a downtrend.</b> Selling here is selling cheap, after most of the retrace has not happened. Wait for price to rally up into premium.`:`<b style="color:var(--bad)">Premium.</b> For a downtrend this is the right area to look for a sell: price has retraced up into an expensive zone, so continuation lower is likelier. Wait for confirmation.`;
    $('#eqT',el).innerHTML=msg+'<br><br>Remember: reaching the zone is never enough. You still need price to react and show confirmation.'};
  $$('#eqD button',el).forEach(b=>b.addEventListener('click',()=>{d=b.dataset.d;$$('#eqD button',el).forEach(x=>x.setAttribute('aria-pressed',x===b));draw()}));
  $('#eqP',el).addEventListener('input',draw);draw()};
PAGES.push({id:'m09',part:'III',n:9,title:'Equilibrium',min:15,level:'Core concept',src:'Source: lesson "Equilibrium Explained"',
lead:'The simplest continuation tool in the course, and the one most often drawn wrong. Equilibrium splits a move in half so you only look for entries in the cheap half.',
goals:['Draw equilibrium from the correct swing points in both trend directions','Define premium and discount and say where each side should trade','Explain why large players avoid the expensive half of a range','Combine equilibrium with FVGs and the other confluences'],
html:`
<h2>What it is</h2>
<p><b>Equilibrium (EQ)</b> is the 50% level of the most recent swing range inside a trend. It divides that range into two zones:</p>
<ul><li><b>Discount</b>: below 50%. In an uptrend this is the area where buyers want to be.</li><li><b>Premium</b>: above 50%. In an uptrend this is expensive, so buying there is topping up at a bad price.</li></ul>
<p>Large players think the same way: they do not want to add to a long at the top of a range. They want price pushed into a discount first, then they buy and send it higher. In a downtrend, everything flips: premium is where you look to sell, discount is where shorts are poorly priced.</p>
${F2('eqUp','eqDown','The dotted line is the 50% level. In the uptrend, price retraces below EQ (into discount), then continues up. In the downtrend, price retraces above EQ (into premium), then continues down.','Uptrend: buy in discount','Downtrend: sell in premium','Premium / discount')}
<h2>How to draw it</h2>
${KEY('<p><b>Uptrend:</b> from the most recent swing low up to the most recent swing high.<br><b>Downtrend:</b> from the most recent swing high down to the most recent swing low.</p>')}
<p>"Most recent" is the entire rule and the entire source of mistakes. Do not stretch the range from a distant low. Draw it from the swing that produced the move you are retracing.</p>
${F('eqWrong','The correct range runs from the latest swing low to the latest swing high. Drawing from an old low shifts the 50% line and tells you a cheaper price than the market really offers.','The most common mistake')}
<p>When you draw it live, wait until the retrace has formed. If a retrace has started after a high, the most recent high is that high and the most recent low is the low of the last leg. Add the tool once the swing is confirmed. A fraction later, if a new swing is made, move it.</p>
${W_('eqLab')}
<h2>Context makes it work</h2>
<p>Equilibrium is a continuation confluence, like the FVG. By itself it is useless; it only matters inside a chain of reasoning:</p>
${steps([['1  Opportunity','Liquidity','Price sweeps a low in a downtrend'],['2  Confirmation','Inverse FVG','A bearish gap is closed above: trend flips'],['3  Continuation','FVG or EQ','Price retraces into a bullish gap or below EQ, then extends']])}
<p>When equilibrium is not reached, a gap may do the job instead. When both are present, the confluence is stronger. Practise on every time frame. The behaviour is the same on the weekly and the 1-minute chart.</p>
${WARN('<p>Drawing the tool the instant a swing appears and shorting the first touch. Wait for a close that shows the reaction. Price can pass EQ and keep going.</p>')}`,
recap:['EQ = 50% of the most recent swing range. Below = discount, above = premium.','Uptrend: buy in discount. Downtrend: sell in premium.','Draw from the MOST RECENT low to high (or high to low). Never from older swings.','It is a continuation confluence. It needs a sweep and confirmation before it.']});
QZ.m09=[
{q:'In a downtrend, from where to where do you draw equilibrium?',o:['Oldest high to newest low','Most recent swing high down to most recent swing low','Any high to any low','From the open to the close'],a:1,w:'Always the most recent swing range in the trend.'},
{q:'In an uptrend, which zone is favourable for looking to buy?',o:['Premium','Discount','Exactly at the high','Neither'],a:1,w:'Large players prefer to accumulate below 50%.'},
{q:'You draw EQ from a low that is 20 candles old. What is the likely effect?',o:['Nothing','The 50% line is in the wrong place, giving a misleading level','It becomes more precise','It switches to a downtrend'],a:1,w:'Using stale swings misplaces EQ.'},
{q:'EQ is classed as a:',o:['Reversal tool','Confirmation tool','Continuation tool','Time tool'],a:2,w:'It shows where a new trend can continue from.'}];

PAGES.push({id:'m10',part:'IV',n:10,title:'SMT Divergence',min:20,level:'Advanced',src:'Source: lesson "SMT Divergence Explained"',
lead:'The S&P 500 and the Nasdaq are tightly correlated, but not identical. When they disagree at an important level, one of them is telling you about the other before it happens.',
goals:['Define a bullish and a bearish SMT divergence','Identify which index is the leader and which is the laggard','Explain why SMT is only useful at real draws on liquidity','Pick the right index for the trade'],
html:`
<p>SMT divergence compares two correlated instruments: here the S&amp;P 500 (ES) and the Nasdaq (NQ). It does not work for forex and commodities in the same form, because it depends on this pair. The instructor admits he does not know what the letters stand for. What matters is how it works.</p>
<h2>The idea</h2>
<p>Because ES and NQ track each other so closely, small disagreements carry information. Imagine both sweep the same major high. If ES makes a high and then a <b>lower high</b>, while NQ makes a high and then a <b>higher high</b>, the two did not confirm each other. ES filled enough orders to start turning down. NQ has not yet turned. ES is leading, and it hints at what NQ will do next.</p>
${F2('smtES','smtNQ','Same time axis on both charts. Both sweep the shared level at candle 2. ES fails to reach it again (lower high). NQ pushes beyond it (higher high). Bearish for both.','S&P 500 (ES): high, then lower high','Nasdaq (NQ): high, then higher high','Bearish SMT divergence')}
<h2>Bullish version</h2>
<p>Mirror image. At a major low, one index makes a low then a <b>higher low</b>, and the other makes a lower low. The index making the higher low leads upward.</p>
${F2('smtESb','smtNQb','Bullish SMT at a significant low: ES holds a higher low, NQ undercuts it.','S&P 500: low, then higher low','Nasdaq: low, then lower low','Bullish SMT divergence')}
${tbl(['','Bearish SMT','Bullish SMT'],[['Leading index','Makes high then LOWER high','Makes low then HIGHER low'],['Lagging index','Makes high then HIGHER high','Makes low then LOWER low'],['Meaning','Orders were likely filled above the high','Orders were likely filled below the low'],['Bias for both','Down','Up'],['Trade on','The leading (weaker) index','The leading (stronger) index']])}
<h2>Location, location</h2>
${KEY('<p>SMT is only valuable while price is sweeping an important draw on liquidity (a high-timeframe high or low, a session extreme, a previous-day level). Away from those levels divergences appear all day and mean almost nothing.</p>')}
<h2>Which index do you trade?</h2>
<p>Trade the leader. In a bearish SMT, the index that failed to sweep the high is the one already carrying the downside intent. Shorting the index that just made a higher high is shorting the stronger index. The lesson's examples show the leading index expanding faster and further than the laggard.</p>
<h2>Use on higher and lower time frames</h2>
<p>On higher time frames (4-hour) SMT works well for <b>bias</b>: it tells you whether a sweep of a major high is likely to reverse. On lower time frames (5-minute) it supports <b>execution</b>. In the strategy lesson the instructor notes a bearish SMT at the London high and uses it to strengthen a bearish plan, even though his daily bias had been bullish.</p>
${WARN('<p>Splitting charts and trading every divergence. Divergence away from liquidity is noise. Divergence without confirmation is just a note on the chart.</p>')}`,
recap:['SMT = ES and NQ disagreeing at a level. One makes a higher high or low, the other fails to.','Bearish: ES lower high vs NQ higher high. Bullish: mirror at lows.','The failing (leading) index is the one to trade. Both indices are expected to follow.','Only relevant at real draws on liquidity. Elsewhere it is noise.']});

{q:'ES makes a high then a lower high. NQ makes a high then a higher high. What is this?',o:['Bullish SMT','Bearish SMT','No signal','A BOS'],a:1,w:'One index failed to make a higher high while the other did: bearish divergence.'},
{q:'Which index do you prefer to short in that situation?',o:['NQ, the stronger','ES, the leader making the lower high','Both with double size','Neither'],a:1,w:'Trade the leading index that is already showing weakness.'},
{q:'When is SMT most meaningful?',o:['Anytime','While sweeping an important draw on liquidity','Only in Asia','Only on the daily'],a:1,w:'Away from liquidity, divergences are frequent and mean little.'},
{q:'For a bullish SMT at a low, the leading index:',o:['Makes a lower low','Makes a higher low','Makes equal lows','Makes no low'],a:1,w:'A higher low shows buyers stepped in sooner.'}];

PAGES.push({id:'m11',part:'IV',n:11,title:'Time Theory',min:14,level:'Core concept',src:'Source: lesson "Time Theory Explained"',
lead:'Even a perfect setup fails at the wrong time. Knowing when the market is likely to move, and when it is likely to do nothing, is a skill of its own.',
goals:['Recall the session times and the thin hour in Eastern Time','Use the 9:30 to 10:30 sequence for New York','Explain why manipulation tends to come first','Decide when to stop looking for trades'],
html:`
<p>Timing matters because the goal is a high-probability read of the day. If you do not understand when new money enters, you work against the clock. This module is deliberately short: the rules are few, and they all hinge on the New York open.</p>
${tbl(['Window (ET)','What it is','Why it matters'],[['18:00 to 03:00','Asia session','Builds the first range of the day'],['03:00 to 08:30','London session (pre-market opens at 02:00)','Often sweeps Asia, then runs the other way'],['08:30 to 09:30','New York pre-market','US traders arrive. Pre-market manipulation is typical. Much data prints at 08:30'],['09:30','New York open','New money enters. Expect a move that takes liquidity'],['09:30 to 09:50','Manipulation window','Price usually sweeps something here'],['09:50 to 10:10','Entry window (the "macro")','The ideal time for the entry'],['by 10:30','Cut-off','No trade by now? The instructor is done for the day'],['13:00','PM session opens','Exists, but is not traded in this system'],['17:00 to 18:00','Spread hour','No market. Spreads on CFD/forex brokers widen. Do not trade']])}
<h2>The logic of the sequence</h2>
<p>The market opens at 09:30 and fresh US money arrives. Fresh money needs counterparties, so we should expect some form of manipulation: a sweep of a higher or lower time frame draw on liquidity. That typically happens in the first twenty minutes. Once the sweep is complete and the market has changed direction, an entry opens between roughly 09:50 and 10:10. By 10:30 the market tends to slow down, so a missing setup means stepping aside.</p>
${F('nyTime','A typical New York morning: price pushes up from the open, makes one last push around 9:55 to sweep, rejects at 10:00, and falls to the higher time frame low by 10:05 to 10:15.','The first hour in New York')}
${KEY('<p>These times are a map, not a gate. The lesson shows a day where the final leg of manipulation arrived at 09:52, two minutes later than usual, and the instructor says he sometimes enters at 09:45 or 10:20. What matters is the order of events: <b>sweep first, entry after</b>.</p>')}
<h2>Examples from the lesson</h2>
${steps([['Example 1','Manipulate up, then sell','9:30 to 9:50 pushes up. A final push at 9:50 gives a 10:00 entry short, which reached higher time frame lows by 10:05.'],['Example 2','Manipulate down, then buy','9:30 opens and sweeps lows. After 9:50 a retrace gives the entry near 10:00, then an extension higher.'],['Example 3','Late sweep','Nothing in the 9:30 window. The final leg of manipulation appears at 9:52, then expansion higher.']])}
<h2>High-impact news days</h2>
<p>On heavy news days price action gets erratic and good examples are rare. The risk module shows one of the instructor's rules for those days: cut position size in half.</p>
${WARN('<p>Entering before the sweep because you are impatient or fear missing out. Let the manipulation happen, then trade the reaction.</p>')}
<h2>Practice</h2>
<ul><li>Pull up the last 20 trading days on a 5-minute chart.</li><li>Mark 09:30, 09:50, 10:10 and 10:30 on each.</li><li>Record what was swept between 09:30 and 09:50 and what the 09:50 to 10:10 move did.</li></ul>`,
recap:['Sessions in ET: Asia 18:00-03:00, London 03:00-08:30, NY pre 08:30, open 09:30, spread hour 17:00-18:00.','Expect a sweep from 09:30 to 09:50. The entry window is 09:50 to 10:10.','If nothing by 10:30, stand aside. The times are a map, not a rigid gate.','Sweep first, entry after.']});

{q:'What does the instructor do if no trade appears by 10:30?',o:['Takes any trade','Is done for the day','Doubles size','Switches to Asia'],a:1,w:'The market slows after 10:30.'},
{q:'The 09:30 to 09:50 window is mainly for:',o:['Entry','Manipulation (sweep)','News only','Rest'],a:1,w:'Fresh money arrives and tends to sweep liquidity first.'},
{q:'The spread hour is:',o:['09:30-10:30','17:00-18:00','03:00-04:00','12:00-13:00'],a:1,w:'The thin hour between New York close and the next session.'}];
